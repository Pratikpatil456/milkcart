<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Milk Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success px-3">
    <a class="navbar-brand" href="{% url 'home' %}">Milk Cart</a>
    <div class="ms-auto">
        <a class="btn btn-outline-light btn-sm me-2" href="{% url 'home' %}">Home</a>
        {% if user.is_authenticated %}
            <a class="btn btn-outline-light btn-sm me-2" href="{% url 'cart' %}">Cart</a>
            <a class="btn btn-outline-light btn-sm me-2" href="{% url 'orders' %}">Orders</a>
            <a class="btn btn-outline-light btn-sm me-2" href="{% url 'wishlist' %}">Wishlist</a>
            <span class="text-white me-2">Hi, {{ user.username }}</span>
            <a class="btn btn-warning btn-sm" href="{% url 'logout' %}">Logout</a>
        {% else %}
            <a class="btn btn-outline-light btn-sm me-2" href="{% url 'login' %}">Login</a>
            <a class="btn btn-warning btn-sm" href="{% url 'signup' %}">Sign Up</a>
        {% endif %}
    </div>
</nav>

<div class="container mt-4">
    {% if messages %}
        {% for m in messages %}
            <div class="alert alert-info">{{ m }}</div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</div>

<footer class="text-center text-muted mt-5 mb-3">
    <small>Copyright 2025 | Milk Cart</small>
</footer>
</body>
</html>
